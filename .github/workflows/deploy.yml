name: Deploy to Cloudflare Pages

# Build the site and push dist/ to the Pages project `mevar`. Same method as
# firstprinciple: GitHub builds, wrangler uploads. Setup is in DEPLOY.md.
#
# A push to main deploys production (mevar.org). "Run workflow" on any other
# branch deploys a preview at <branch>.mevar.pages.dev.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "markdown/**"
      - "images/**"
      - "files/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Public repo: the standard runner has 16 GB of RAM, the build needs an
    # 8 GB heap.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # astro build, then pagefind --site dist
      - run: npm run build

      # Goal 03's check: every Ghost URL resolves, no broken internal link.
      - run: npm run check:dist

      - run: npm run check:limits

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          npx wrangler@4 pages deploy dist
          --project-name=mevar
          --branch="$BRANCH"

name: Deploy to Cloudflare Pages

# Build the site and push dist/ to the Pages project `mevar`. Same method as
# firstprinciple: GitHub builds, wrangler uploads. Setup is in DEPLOY.md.
#
# A push to main deploys production (mevar.org). "Run workflow" on any other
# branch deploys a preview at <branch>.mevar.pages.dev.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "markdown/**"
      - "images/**"
      - "files/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Public repo: the standard runner has 16 GB of RAM, the build needs an
    # 8 GB heap.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Astro's content store: each work as parsed and rendered, with the
      # digest of its file, so a build parses only the files that changed.
      # It is under node_modules/, which npm ci empties: restored after it.
      # A run restores the newest store made from the same inputs, if there
      # is one, and saves its own.
      #
      # Astro clears the store by itself when content.config.ts, an option of
      # astro.config.mjs or its own version changes. The key holds the rest
      # of what a stored work is made from: the packages, the rehype plugins
      # (astro.config.mjs lists them; Astro's digest does not see a function)
      # and what they read outside the work's own file, that is the Bible
      # parsers, the images in a body, and the title and summary of each
      # published post a body links to (`/<slug>/`), which a « Cité dans ce
      # texte » card shows in another work. Every link, not only a card's:
      # more posts than the cards show, none missed. A new post nothing
      # links to leaves the key as it is.
      - id: store
        env:
          FILES: >-
            ${{ hashFiles('web/package-lock.json', 'web/astro.config.mjs',
            'web/src/lib/*.mjs', 'web/src/lib/icons.json',
            'scripts/65-normalize-bible.mjs', 'scripts/66-normalize-bible-en.mjs',
            'scripts/bible-books.mjs', 'images/mevar/content/**') }}
        run: |
          echo "inputs=$FILES-$(node --input-type=module -e '
          import fs from "node:fs";
          import { hash } from "node:crypto";
          import { posts } from "./src/lib/bookmarks.mjs";
          const linked = new Set();
          for (const f of fs.readdirSync("../markdown", { recursive: true })) {
            if (!f.endsWith(".md")) continue;
            const text = fs.readFileSync(`../markdown/${f}`, "utf8");
            for (const [slug] of text.slice(text.indexOf("\n---\n", 4)).matchAll(/(?<=\/)[a-z0-9-]+(?=\/)/g)) linked.add(slug);
          }
          console.log(hash("sha256", JSON.stringify([...posts].filter(([slug]) => linked.has(slug)))));
          ')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: web/node_modules/.astro/data-store.json
          key: content-store-${{ steps.store.outputs.inputs }}-${{ github.run_id }}
          restore-keys: content-store-${{ steps.store.outputs.inputs }}-

      # astro build, then pagefind --site dist
      - run: npm run build

      # Goal 03's check: every Ghost URL resolves, no broken internal link.
      - run: npm run check:dist

      - run: npm run check:limits

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          npx wrangler@4 pages deploy dist
          --project-name=mevar
          --branch="$BRANCH"
